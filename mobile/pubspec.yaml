name: wallet_app
description: "The Digital Private Vault — Kişisel Finans Yönetim Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^17.2.3

  # HTTP
  dio: ^5.8.0+1

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Storage
  flutter_secure_storage: ^10.0.0
  hive_flutter: ^1.1.0

  # Auth
  google_sign_in: ^6.2.2
  local_auth: ^3.0.1

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0

  # SVG
  flutter_svg: ^2.0.0

  # UI & Charts
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Camera & Images
  camera: ^0.12.0+1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.15.1

  # Utilities
  intl: ^0.20.2
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0

  google_fonts: ^8.1.0
  cupertino_icons: ^1.0.8
  tutorial_coach_mark: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  freezed: ^3.2.5
  injectable_generator: ^3.0.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#131313"
  image: assets/images/nexspend-icon.png
  color_dark: "#131313"
  image_dark: assets/images/nexspend-icon.png
  android_12:
    color: "#131313"
    image: assets/images/nexspend-icon.png
    color_dark: "#131313"
    image_dark: assets/images/nexspend-icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/nexspend-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#131313"
  adaptive_icon_foreground: "assets/images/nexspend-icon.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

name: wallet_app
description: "The Digital Private Vault — Kişisel Finans Yönetim Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Navigation
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0+1

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Storage
  flutter_secure_storage: ^9.2.4
  hive_flutter: ^1.1.0

  # Auth
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0

  # UI & Charts
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Camera & Images
  camera: ^0.11.1
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

  # Utilities
  intl: ^0.20.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  freezed: ^2.5.8
  injectable_generator: ^2.7.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/
    - assets/images/

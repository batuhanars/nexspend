name: Mobile CI

# Her PR ve main push'unda tetiklenir. İçerideki "changes" job'u
# mobile/ veya bu workflow değişip değişmediğine bakar; ilgisiz
# değişikliklerde downstream job'u SKIPPED olur — branch protection için
# PASS sayılır. Böylece doc-only PR'lar da required check'leri yeşilleştirebilir.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: mobile

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'mobile/**'
              - '.github/workflows/mobile-ci.yml'

  analyze-and-test:
    name: Analyze + Test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

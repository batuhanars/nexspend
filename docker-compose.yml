services:
  api:
    build:
      context: ./api
    container_name: wallet_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Backend'in tüm env'i (JWT, Google, mail, EVDS, FCM...) api/.env'den gelir.
    env_file:
      - ./api/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      # Konteyner içinden DB'ye "localhost" değil servis adı "db" ile bağlanılır.
      # Bu satır api/.env'deki DATABASE_URL'i ezer (host-run dev'de localhost kalır).
      DATABASE_URL: mysql://${DB_USER:-wallet_user}:${DB_PASSWORD:-wallet_pass}@db:3306/${DB_NAME:-wallet_db}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - wallet_uploads:/app/uploads

  db:
    image: mysql:8.0
    container_name: wallet_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-wallet_db}
      MYSQL_USER: ${DB_USER:-wallet_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-wallet_pass}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - wallet_db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wallet_db_data:
  wallet_uploads:
